# Free projekt Supabase se po týdnu bez aktivity v databázi uspí.
# Tento běh každý den spustí v databázi `select 1` (funkce public.udrzet_aktivitu) přes veřejný klíč.
# Nečte ani nezapisuje žádnou tabulku ani uživatelská data (docs/ACCOUNTS.md).
name: Udržet aktivní Supabase

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-free-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: dotaz do databáze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Udržovací dotaz do databáze
        run: node scripts/supabase-keepalive.mjs
