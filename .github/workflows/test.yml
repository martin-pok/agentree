# Testy na všech třech systémech.
#
# macOS je cílová platforma, ale Linux a Windows tu nejsou pro parádu: Agenteeq je čistý Node
# bez závislostí a právě tahle matice je jediný způsob, jak poctivě zjistit, co z něj jinde
# opravdu funguje a co jen předpokládáme. Windows běh je zároveň podklad pro rozhodnutí
# o verzi pro Windows (docs/WINDOWS.md) — netvrdíme nic, co tenhle workflow neukázal.
name: Testy

on:
  # Run branches through their PR only; pushing to an open PR otherwise duplicates the
  # same 8-job matrix and cancel-in-progress can kill half of each run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jedno aktuální ověření na PR: nový push do PR zruší starší běh. Každý commit na main se ale
# ověří celý (vlastní skupina podle SHA, nic se neruší): „Připravit vydání“ přijme jen commit
# se zelenými Testy, a dřív dvě rychle po sobě sloučené PR navzájem zrušily ověření.
concurrency:
  group: test-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Jeden systém nesmí shodit ostatní — potřebujeme vidět výsledek všech tří.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Projekt nemá žádné závislosti, takže žádná instalace není potřeba — jen Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verze Node
        run: node --version

      - name: Kontrola syntaxe
        run: npm run check

      - name: Testy
        run: npm test

      # Testy ověřují jednotlivé kusy. Tenhle krok ověřuje, co z nich nevyplývá:
      # že se celá aplikace na daném systému spustí a obslouží rozhraní přes HTTP.
      # Je to jediný důkaz o Windows, který nestojí na domněnce.
      - name: Aplikace opravdu nastartuje
        run: npm run smoke:server

  # Plášť pro Windows (desktop/windows/Agenteeq.cpp) se tu překládá a sestavená aplikace
  # se spustí z archivu (qa:native). Snímek okna je v artefaktu qa-native-windows. Vzhled
  # a ovládání okna do detailu posoudí jen člověk u skutečného Windows.
  windows-plast:
    name: plášť pro Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Nástroje Visual Studio
        shell: pwsh
        run: ./scripts/msvc-prostredi.ps1

      - name: Sestavit
        run: npm run build:windows

      - name: Výsledek
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/Agenteeq-*-Windows-x64.zip
          '{0} — {1:N1} MB' -f $zip.Name, ($zip.Length / 1MB)

      # Audit the REAL generated ZIP, not only the packaging script. Recursively
      # exclude legacy duplicate icons but require the current brand master.
      - name: Ověřit brand přímo v distribučním Windows ZIPu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = (Get-ChildItem dist/Agenteeq-*-Windows-x64.zip | Select-Object -First 1)
          if (-not $archive) { throw 'Missing Windows installer ZIP' }
          $out = Join-Path $env:RUNNER_TEMP 'agenteeq-brand-zip-audit'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $out -Force
          $entries = @(Get-ChildItem -Path $out -Recurse -File)
          $old = @($entries | Where-Object { $_.Name -in @('Agenteeq-icon.png', 'Agenteeq.icns', 'robot-predloha.svg', 'agentree-mark.svg') })
          if ($old.Count -ne 0) { throw "Legacy icon in Windows ZIP: $($old.FullName -join ', ')" }
          $marks = @($entries | Where-Object { $_.Name -eq 'agenteeq-mark.svg' -and $_.FullName -match '[\\/]public[\\/]brand[\\/]' })
          if ($marks.Count -ne 1) { throw "Expected exactly one current brand master, got $($marks.Count)" }

      # Rozbalit archiv jako člověk, spustit Agenteeq.exe, počkat na server a na vykreslené
      # rozhraní v okně, nafotit obrazovku, ukončit a ověřit, že server skončil s ním.
      - name: Aplikace ze zipu nastartuje
        run: npm run qa:native

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-qa-native-windows
          path: dist/qa-native/

      # Balíček si může stáhnout kdokoli z běhu a spustit ho na skutečném Windows.
      # Dokud to někdo neudělá, zůstává vzhled a chování okna neověřené.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-Agenteeq-Windows
          path: dist/Agenteeq-*-Windows-x64.zip

  # Aplikace pro Mac se dřív sestavovala jen při vydání a nikdo ji v CI nespustil. Tady se
  # sestaví stejně jako pro vydání (ad-hoc podpis), rozbalí z archivu a spustí.
  mac-aplikace:
    name: aplikace pro Mac
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Sestavit
        run: npm run build:mac

      - name: Verify actual packaged ICNS and no obsolete artwork
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -name 'Agenteeq-*-macOS-arm64.zip' -print -quit)"
          test -n "$archive"
          mkdir -p dist/qa-bundle-icons
          ditto -x -k "$archive" dist/qa-bundle-icons
          test -s dist/qa-bundle-icons/Agenteeq.app/Contents/Resources/Agenteeq.icns
          test ! -e dist/qa-bundle-icons/Agenteeq.app/Contents/Resources/app/desktop/Agenteeq.icns
          test ! -e dist/qa-bundle-icons/Agenteeq.app/Contents/Resources/app/desktop/Agenteeq-icon.png
          test -s dist/Agenteeq-icon.png
          sips -g format dist/Agenteeq-icon.png | grep -q 'format: png'
          echo "Verified signed Mac bundle contains only generated icon and matching preview"

      # 0.46 ships a custom Finder DMG; validate the exact installer path before tagging.
      - name: Sestavit a ověřit instalátor DMG
        run: npm run build:dmg

      - name: Aplikace ze zipu nastartuje
        run: npm run qa:native

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-qa-native-macos
          path: dist/qa-native/

      # Aktualizace naostro: výměna aplikace, restart a ukončení i se zaseknutým serverem.
      - name: Aktualizace z aplikace a ukončení nikdy nezaseknou
        run: npm run qa:update

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-qa-update-macos
          path: dist/qa-update/

  browser-qa:
    name: rozhraní a přístupnost
    # Připnuto: ubuntu-latest se od 19. 10. 2026 postupně přepíná na 26.04 (runner-images #14748)
    # a `playwright install --with-deps` instaluje systémové balíčky podle verze systému.
    # Na 24.04 je QA ověřené; přechod na 26.04 až s verzí Playwrightu, která ji podporuje.
    runs-on: ubuntu-24.04
    # Kontrast se od 0.38.0 měří ve čtyřech vzhledech a qa:desktop klepe i na výběr vzhledu.
    # Instalace prohlížečů (apt) sama trvá na runneru 1–11 minut, 20 minut na celek nestačilo.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      # Výhradně nástroj QA; nevstupuje do runtime balíčku ani package.json.
      # Prohlížeče se instalují z lokálního binárního souboru (ne `npx`): `npx` by při chybějícím
      # balíčku tiše stáhl libovolnou verzi; takhle by krok selhal.
      - run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.10.3
      # Instalace prohlížečů občas trvá až do vypršení úlohy: zrcadlo azure.archive.ubuntu.com
      # posílá balíčky po jednotkách kB/s (23. 10. 2026 čtyřikrát za sebou), dřív než začne test.
      # Každý pokus má 5 minut; další pokus přepne apt na hlavní archiv Ubuntu (runner bere zrcadla
      # z /etc/apt/apt-mirrors.txt přes mirror+file:, proto se přepisuje hlavně ten). Třetí selhání je skutečné.
      - name: Nainstalovat prohlížeče (chromium webkit)
        run: |
          for pokus in 1 2 3; do
            timeout -k 10 300 ./node_modules/.bin/playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Instalace prohlížečů selhala nebo byla příliš pomalá (pokus $pokus), zkouším hlavní archiv Ubuntu."
            sudo pkill -f apt-get || true; sleep 3
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          done
          exit 1
      - run: npm run qa:desktop
      - run: npm run qa:ai-studio
      - run: npm run qa:axe
      - run: npm run qa:desktop-inset
      - run: npm run qa:assistant
      - run: npm run qa:refresh
      - run: npm run qa:tvary
      - run: npm run qa:studio
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-browser-qa
          path: |
            dist/qa/

  browser-web-qa:
    name: Web, rozšíření a kontrast
    # Připnuto: ubuntu-latest se od 19. 10. 2026 postupně přepíná na 26.04 (runner-images #14748)
    # a `playwright install --with-deps` instaluje systémové balíčky podle verze systému.
    # Na 24.04 je QA ověřené; přechod na 26.04 až s verzí Playwrightu, která ji podporuje.
    runs-on: ubuntu-24.04
    # Independently test site/extension/a11y; do not serialize behind long desktop QA.
    # Playwright --with-deps can spend >23 min provisioning WebKit system packages
    # on a fresh GitHub runner. 25 min cancelled qa:site before qa:extension/qa:contrast.
    # Allow the full QA to finish; never treat cancelled tests as passing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      # axe-core: WCAG 2.2 A/AA na webu a v okně rozšíření (scripts/axe-kontrola.mjs). Jen nástroj QA.
      - run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.10.3
      # Instalace prohlížečů občas trvá až do vypršení úlohy: zrcadlo azure.archive.ubuntu.com
      # posílá balíčky po jednotkách kB/s (23. 10. 2026 čtyřikrát za sebou), dřív než začne test.
      # Každý pokus má 5 minut; další pokus přepne apt na hlavní archiv Ubuntu (runner bere zrcadla
      # z /etc/apt/apt-mirrors.txt přes mirror+file:, proto se přepisuje hlavně ten). Třetí selhání je skutečné.
      - name: Nainstalovat prohlížeče (chromium webkit)
        run: |
          for pokus in 1 2 3; do
            timeout -k 10 300 ./node_modules/.bin/playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Instalace prohlížečů selhala nebo byla příliš pomalá (pokus $pokus), zkouším hlavní archiv Ubuntu."
            sudo pkill -f apt-get || true; sleep 3
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          done
          exit 1
      - run: npm run qa:site
      - run: npm run qa:extension
      - name: Skutečné MV3 rozšíření a 11 detektorů proti izolované aplikaci
        run: npm run qa:detectors
      - run: npm run qa:contrast
      - name: browser-web-qa
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-browser-web-qa
          path: |
            dist/qa-site/
            dist/qa-extension/
            dist/qa-contrast/
            dist/qa-detection/

  chrome-store:
    name: Chrome Web Store branding a screenshoty
    # Připnuto: ubuntu-latest se od 19. 10. 2026 postupně přepíná na 26.04 (runner-images #14748)
    # a `playwright install --with-deps` instaluje systémové balíčky podle verze systému.
    # Na 24.04 je QA ověřené; přechod na 26.04 až s verzí Playwrightu, která ji podporuje.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      # Instalace prohlížečů občas trvá až do vypršení úlohy: zrcadlo azure.archive.ubuntu.com
      # posílá balíčky po jednotkách kB/s (23. 10. 2026 čtyřikrát za sebou), dřív než začne test.
      # Každý pokus má 5 minut; další pokus přepne apt na hlavní archiv Ubuntu (runner bere zrcadla
      # z /etc/apt/apt-mirrors.txt přes mirror+file:, proto se přepisuje hlavně ten). Třetí selhání je skutečné.
      - name: Nainstalovat prohlížeče (chromium)
        run: |
          for pokus in 1 2 3; do
            timeout -k 10 300 ./node_modules/.bin/playwright install --with-deps chromium && exit 0
            echo "::warning::Instalace prohlížečů selhala nebo byla příliš pomalá (pokus $pokus), zkouším hlavní archiv Ubuntu."
            sudo pkill -f apt-get || true; sleep 3
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          done
          exit 1

      - name: Ověřit PWA a Apple ikony proti Dock SVG
        run: npm run qa:icons

      # Chrome Web Store podklady renderujeme ze stejných SVG/HTML zdrojů jako release.
      # Artefakt umožňuje zkontrolovat nové promo a marquee bez odhadů či generovaných mockupů.
      - name: Renderovat aktuální Chrome Web Store branding
        run: |
          node branding/chrome-web-store/render.mjs
      - name: Zabránit tiché změně schválených ikon při renderování
        run: git diff --exit-code -- extension/icons/icon-16.png extension/icons/icon-32.png extension/icons/icon-48.png extension/icons/icon-128.png
      - name: Vyrenderovat aktuální snímky extension pro obchod
        run: node branding/chrome-web-store/snimky.mjs
      - name: Ověřit úplnost exportů Chrome Web Store
        run: node --test test/chrome-web-store.test.mjs test/brand-robot.test.mjs
      - name: Sestavit instalační ZIP rozšíření pro Chrome Web Store
        run: npm run build:extension
      - name: Uložit ZIP připravený k nahrání do Chrome Web Store
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-agenteeq-extension-store-upload
          path: dist/agenteeq-extension-*.zip
      - name: Uložit skutečné snímky pro Chrome Web Store
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-chrome-store-screenshots
          path: |
            branding/chrome-web-store/export/snimek-*.png
            branding/chrome-web-store/export/en/snimek-*.png
      - name: Uložit skutečně vyrenderované brand assety
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-chrome-store-branding
          path: |
            branding/chrome-web-store/export/icon-128.png
            branding/chrome-web-store/export/promo-small-440x280.png
            branding/chrome-web-store/export/marquee-1400x560.png
            extension/icons/icon-*.png

      # A release candidate is a single reviewable, content-addressed upload set.
      # Only main receives this artifact: PR builds are not publisher candidates.
      # Still requires the entire 8/8 run to finish green and manual Chrome/host UAT.
      - name: Připravit verifikovatelnou sadu pro ruční nahrání do obchodu
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/prepare-chrome-store-kit.mjs
      - name: Uložit kompletní balíček obchodu s otisky souborů
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          enableCrossOsArchive: true
          key: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}-chrome-store-review-kit
          path: dist/chrome-store-kit/
