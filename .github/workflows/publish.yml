# Zveřejnění konceptu vydání: Actions → Zveřejnit vydání → Run workflow nad `main`, tag např. v0.25.0.
#
# Workflow Vydání (release.yml) zakládá jen koncept, protože zveřejnění je krok ven ke stažení
# a patří člověku. Tohle je ten krok: běží jen na ruční spuštění, nikdy sám od sebe.
# Preview je výchozí a nikdy nesmí přepsat stabilní GitHub Latest.
#
# Před zveřejněním se popis generuje z CHANGELOG.md přesně vydávaného tagu,
# nikoli z novějšího main. Release notes tak neslibují změny mimo sestavené binárky. Zveřejní se jen koncept (už zveřejněné vydání se nepřepisuje) a jen když má všechny
# přílohy se stálým jménem, na které vedou tlačítka ke stažení na webu (ZIP a DMG pro Mac,
# ZIP pro Windows a verzovaný ZIP rozšíření pro Chrome).
name: Zveřejnit vydání

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag konceptu, který se zveřejní (např. v0.25.0)'
        required: true
      channel:
        description: 'Preview (neovlivní Latest) nebo Stable (změní Latest)'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - stable
      confirm_stable:
        description: 'Potvrzuji záměr změnit stabilní Latest (jen pro Stable)'
        type: boolean
        default: false

# Výchozí práva tokenu jen pro čtení; zápis má jen úloha, která vydání zveřejňuje.
permissions:
  contents: read

jobs:
  zverejnit:
    name: zveřejnit koncept
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # úprava a zveřejnění GitHub releasu
      actions: read # čtení výsledků povinného CI pro přesný tag commit
    steps:
      # Do repozitáře se nepushuje (vydání mění `gh` přes GH_TOKEN), token v checkoutu netřeba.
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      # Tag musí ukazovat na commit, který prošel kompletní maticí CI.
      # Kontrola přes GitHub API nevyžaduje externí službu ani placenou licenci.
      - name: Ověřit zelené CI označeného commitu
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq '.object.sha')
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.sha')" = "$SHA"
          GH_SHA="$SHA" node --input-type=module -e '
            if (!/^[a-f0-9]{40}$/.test(process.env.GH_SHA)) process.exit(1);
          '
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${SHA}&per_page=30")
          GH_SHA="$SHA" RUNS_JSON="$RUNS" node --input-type=module -e '
            const runs = JSON.parse(process.env.RUNS_JSON).workflow_runs || [];
            if (!runs.some(r => r.head_sha === process.env.GH_SHA && r.status === "completed" && r.conclusion === "success")) {
              console.error("::error::Tag nemá úspěšný kompletní test.yml běh na shodném commitu.");
              process.exit(1);
            }
          '
      - name: Zkontrolovat koncept
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Zveřejňuje se jen z main (spuštěno z $GITHUB_REF)."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG nemá tvar vX.Y.Z."
            exit 1
          fi
          gh release view "$TAG" --json isDraft,assets,body,databaseId,tagName > vydani.json
          node -e '
            const v = JSON.parse(require("fs").readFileSync("vydani.json", "utf8"));
            if (!v.isDraft) { console.log("::error::Vydání už je zveřejněné, nic se nemění."); process.exit(1); }
            if (v.tagName !== process.env.TAG || !Number.isSafeInteger(v.databaseId) || v.databaseId < 1) {
              console.error("::error::Draft má neplatný tag nebo release databaseId."); process.exit(1);
            }
            const expectedExtension = `agenteeq-extension-${process.env.TAG.slice(1)}.zip`;
            for (const stala of ["Agenteeq-macOS-arm64.zip", "Agenteeq-macOS-arm64.dmg", "Agenteeq-Windows-x64.zip", expectedExtension]) {
              if (!v.assets.some((a) => a.name === stala)) {
                console.log(`::error::Chybí příloha ${stala} – tlačítko ke stažení na webu by vedlo do prázdna.`);
                process.exit(1);
              }
            }
            console.log(v.assets.map((a) => `${a.name} ${a.size}`).join("\n"));
          '

      # Re-download the DRAFT assets from GitHub before changing their visibility.
      # Compare exact inventory, bytes and sizes against *both* GitHub's published
      # asset digests and SHA256SUMS.txt. The build already checked local files,
      # but only this second pass checks the files actually stored by GitHub.
      - name: Znovu stáhnout a nezávisle ověřit všech 8 příloh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # GitHub GET /releases/tags/{tag} deliberately returns 404 for DRAFTS.
          # Resolve the database ID from the authenticated CLI draft lookup,
          # then use the REST by-ID endpoint; the verifier checks exact tag/draft.
          RELEASE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("vydani.json", "utf8")).databaseId')
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "::error::Missing draft release ID."; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release-metadata.json
          mkdir -p overene-prilohy
          gh release download "$TAG" --dir overene-prilohy --repo "$GITHUB_REPOSITORY"
          node scripts/verify-release-assets.mjs "$TAG" overene-prilohy release-metadata.json
          (cd overene-prilohy && sha256sum --check SHA256SUMS.txt)

      # Skript popisu čte jména a velikosti příloh ze složky. Soubory se nestahují: stačí prázdné
      # soubory se skutečnou velikostí. Podpis se přebírá z popisu, který napsal build – build
      # je jediný, kdo ví, jestli se podepsal Developer ID.
      - name: Přegenerovat popis
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p prilohy
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("vydani.json", "utf8"));
            for (const a of v.assets.filter((x) => /\.(zip|dmg)$/.test(x.name))) {
              fs.writeFileSync(`prilohy/${a.name}`, "");
              fs.truncateSync(`prilohy/${a.name}`, a.size);
            }
            if (v.body.includes("Developer ID a notarizovaná")) fs.writeFileSync("prilohy/latest-build.json", JSON.stringify({ signature: "Developer ID" }));
          '
          # Changelog musí pocházet ze stejného commitu jako vydávané binárky.
          # Checkout main používáme pro bezpečnostní verifier, ne pro release obsah.
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          REF_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)
          REF_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.type)
          if [ "$REF_TYPE" = "tag" ]; then REF_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REF_SHA}" --jq .object.sha); fi
          test "$TAG_SHA" = "$REF_SHA" || { echo "::error::Release tag moved during publication."; exit 1; }
          git show "${TAG_SHA}:CHANGELOG.md" > CHANGELOG.md
          node scripts/release-notes.mjs "${TAG#v}" prilohy > poznamky.md
          cat poznamky.md

      - name: Zveřejnit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          CONFIRM_STABLE: ${{ inputs.confirm_stable }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            preview)
              # The opt-in Preview channel must never silently replace Stable Latest.
              gh release edit "$TAG" --notes-file poznamky.md --draft=false --prerelease --latest=false
              ;;
            stable)
              if [ "$CONFIRM_STABLE" != "true" ]; then
                echo "::error::Stable release requires an explicit confirmation."
                exit 1
              fi
              gh release edit "$TAG" --notes-file poznamky.md --draft=false --prerelease=false --latest
              ;;
            *)
              echo "::error::Unsupported release channel."
              exit 1
              ;;
          esac
          gh release view "$TAG" --json isDraft,isPrerelease,url,publishedAt

      # Preview keeps stable Latest untouched; only a confirmed Stable release changes
      # /releases/latest/download/… and requires the stable asset-link verification.
      - name: Ověřit kanál a odkazy ke stažení
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          IS_PREVIEW=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$CHANNEL" = "preview" ]; then
            test "$IS_PREVIEW" = "true" || { echo "::error::Preview is not marked prerelease."; exit 1; }
            test "$LATEST" != "$TAG" || { echo "::error::Preview unexpectedly became Latest."; exit 1; }
            echo "Preview $TAG is public; stable Latest remains $LATEST."
            exit 0
          fi
          test "$IS_PREVIEW" = "false" || { echo "::error::Stable is still marked prerelease."; exit 1; }
          test "$LATEST" = "$TAG" || { echo "::error::Stable is not Latest."; exit 1; }
          for SOUBOR in Agenteeq-macOS-arm64.zip Agenteeq-macOS-arm64.dmg Agenteeq-Windows-x64.zip; do
            OK=
            for pokus in 1 2 3 4 5 6; do
              CIL=$(curl -sI "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$SOUBOR" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
              echo "$SOUBOR vede na: $CIL"
              case "$CIL" in
                *"/releases/download/$TAG/$SOUBOR") OK=1; break ;;
              esac
              sleep 10
            done
            if [ -z "$OK" ]; then
              echo "::error::Odkaz ke stažení $SOUBOR nevede na přílohu $TAG."
              exit 1
            fi
          done
