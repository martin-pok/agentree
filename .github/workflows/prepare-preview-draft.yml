# Kandidát na vydání (neveřejný Draft) se sestaví jen NA POKYN: Actions → „Připravit vydání“ →
# Run workflow nad main. Dřív vznikal po každém zeleném CI na main a v seznamu vydání viselo
# mnoho nedokončených Draftů; rozhodnutí vlastníka 20. 10. 2026: Draft jen pro vydání, které se
# opravdu chystá. Zveřejnění zůstává ruční (publish.yml) až po ověření příloh.
name: Připravit vydání

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-preview-draft-main
  cancel-in-progress: false

jobs:
  prepare:
    name: enqueue verified release build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # only dispatch existing release.yml; no direct publishing
    steps:
      # Záměrně bez `ref:`: výchozí checkout je spuštěný main. Brána níže vyžaduje
      # HEAD == aktuální main a úspěšné Testy na přesně tomto commitu.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Verify exact main, version consistency and release notes
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA=$(git rev-parse HEAD)
          if ! [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid source SHA."
            exit 1
          fi
          # Kandidát se staví jen z commitu, na kterém prošly kompletní Testy po push do main.
          ZELENE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$TESTED_SHA&event=push&status=success" --jq .total_count)
          if [ "$ZELENE" = "0" ]; then
            echo "::error::Na $TESTED_SHA zatím nejsou zelené Testy; počkej na doběhnutí CI a spusť znovu."
            exit 1
          fi
          echo "tested_sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$CURRENT_MAIN" != "$TESTED_SHA" ] || [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "Newer main exists; its own CI will prepare the newer candidate."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || [ "$VERSION" != "$MANIFEST" ]; then
            echo "::error::Invalid or inconsistent native/Chrome release versions."
            exit 1
          fi
          if ! grep -Fq "## $VERSION –" CHANGELOG.md || ! grep -Fq "version: '$VERSION'" public/js/whats-new-data.js; then
            echo "::error::Version $VERSION has no matching CHANGELOG / What's New entry."
            exit 1
          fi
          TAG="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists: leave it immutable; no build dispatched."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
      - name: Build next draft from exact tested SHA
        if: steps.gate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.gate.outputs.tested_sha }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref=main -f "inputs[tag]=$TAG" -f "inputs[expected_sha]=$TESTED_SHA"
          {
            echo "### Draft build queued: $TAG"
            echo "Tested source SHA: $TESTED_SHA"
            echo "No publication or installation has occurred."
            echo "Follow release.yml for the Mac DMG, Windows/Chrome ZIP and SHA256SUMS."
            echo "Manual real-device QA and publish.yml approval are still required."
          } >> "$GITHUB_STEP_SUMMARY"
