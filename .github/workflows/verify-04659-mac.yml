name: Verify 0.46.59 Mac candidate

on:
  push:
    branches: [sync/released-04658]

permissions:
  contents: read

jobs:
  mac:
    if: github.event.head_commit.message == 'Verify 0.46.59 Mac build'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Check and test candidate
        run: npm run check && npm test
      - name: Build and launch native Mac app
        run: npm run build:mac && npm run qa:native
