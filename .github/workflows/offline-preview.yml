name: Offline frontend preview
on:
  push:
    branches: [design/046-premium-landing]
    paths:
      - 'site/**'
      - 'public/**'
      - 'scripts/build-offline-preview.mjs'
      - '.github/workflows/offline-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    name: Generate clickable preview ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/build-offline-preview.mjs
      - name: Validate HTML links and assets
        run: |
          test -s dist/agenteeq-preview/index.html
          test -s dist/agenteeq-preview/lp.css
          test -s dist/agenteeq-preview/lp.js
          grep -q 'href="./lp.css"' dist/agenteeq-preview/index.html
          grep -q 'DOMContentLoaded' dist/agenteeq-preview/index.html
          ! grep -q 'type="module" src="./lp.js"' dist/agenteeq-preview/index.html
      - name: Upload complete offline frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agenteeq-clickable-frontend-preview
          path: dist/agenteeq-preview/
          if-no-files-found: error
          retention-days: 30
