# One-time publication explicitly requested by the repository owner on 2026-10-20.
# Guard: exact audited GitHub Actions release run must complete successfully first.
# This job cannot edit any release directly. The existing publish.yml re-verifies exact tag, bytes, SHA-256, CI and channel.
# Delete this helper after the Preview is published.
name: One-time audited v0.46.51 Preview publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-request-v0.46.51-once.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'publish audited v0.46.51 preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check exact audited Draft release and request verified Preview publication
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: 7009455a0bb4be7f578040328a148234d276df45
          RELEASE_RUN_ID: '39499962662'
          TAG: v0.46.51
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          # Guard against concurrent product changes. The source tag remains immutable.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.type)" = "tag"
          for n in $(seq 1 150); do
            data=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")
            source=$(jq -r '.head_sha' <<<"${data}")
            status=$(jq -r '.status' <<<"${data}")
            conclusion=$(jq -r '.conclusion' <<<"${data}")
            test "${source}" = "${TESTED_SHA}" || { echo "::error::Source mismatch"; exit 1; }
            if [ "${status}" = completed ]; then
              test "${conclusion}" = success || { echo "::error::Release build/audit did not pass"; exit 1; }
              break
            fi
            if [ "${n}" = 150 ]; then
              echo "::error::Audited release did not finish within the window."
              exit 1
            fi
            sleep 15
          done
          # Independently check for exactly one private draft with all 8 release files.
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30")
          count=$(jq --arg tag "${TAG}" '[.[] | select(.tag_name == $tag and .draft == true and (.assets | length) == 8)] | length' <<<"${releases}")
          test "${count}" = 1 || { echo "::error::Audited Draft not found or incomplete"; exit 1; }
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/dispatches" \
            -f ref=main -f "inputs[tag]=${TAG}" -f 'inputs[channel]=preview'
          echo "Requested existing audited Preview publication for ${TAG}. Stable Latest is unchanged."
