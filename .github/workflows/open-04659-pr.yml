name: Open 0.46.59 pull request

on:
  push:
    branches: [sync/released-04658]

permissions:
  contents: read

jobs:
  open:
    if: github.event.head_commit.message == 'Open tested 0.46.59 pull request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open normal PR for review and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title='Fix English language during Mac update and relaunch (0.46.59)' \
            -f head='sync/released-04658' \
            -f base='main' \
            -f body='Restores the saved language in the native macOS loading screen, update progress, menus and dialogs. Includes the 0.46.58 source sync, a restart regression test, and the 0.46.59 version bump. Local npm test: 1457 passed, 0 failed, 13 skipped. Release only after the PR CI and exact Mac build pass.' \
            --jq '.html_url'
