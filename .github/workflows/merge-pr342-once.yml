# Owner-authorized one-time patch gate for Preview v0.46.57.
# Do not merge if the exact PR source and complete CI / CodeQL differ.
name: One-time include CTA contrast fix for 0.46.57

on:
  workflow_run:
    workflows: ['Testy']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: once-merge-pr342-04657
  cancel-in-progress: false

jobs:
  include-verified-fix:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_sha == 'ecc0d78bdbb999575028fdb5eaecd45bce9c4403'
      && github.event.workflow_run.head_branch == 'fix/04657-primary-button-logo-contrast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ecc0d78bdbb999575028fdb5eaecd45bce9c4403
    steps:
      - name: Assert CodeQL passed for exact source
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/runs?head_sha=$EXPECTED_HEAD&event=pull_request&per_page=30" \
            --jq '[.workflow_runs[] | select(.head_sha == "ecc0d78bdbb999575028fdb5eaecd45bce9c4403" and .status == "completed" and .conclusion == "success")] | length')
          test "$COUNT" -ge 1 || { echo "::error::Exact CodeQL not green."; exit 1; }
      - name: Check PR 342 mergeability and exact immutable head
        shell: bash
        run: |
          set -euo pipefail
          OK=
          for attempt in $(seq 1 18); do
            STATE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/342" --jq '
              .number == 342 and .state == "open" and .draft == false
              and .head.sha == "ecc0d78bdbb999575028fdb5eaecd45bce9c4403"
              and .head.ref == "fix/04657-primary-button-logo-contrast"
              and .base.ref == "main" and .mergeable == true')
            if [ "$STATE" = true ]; then OK=1; break; fi
            sleep 10
          done
          test "$OK" = 1 || { echo "::error::PR changed or is not mergeable."; exit 1; }
      - name: Merge patch into main and authorize exact Preview build
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/342/merge" \
            -f "sha=$EXPECTED_HEAD" \
            -f merge_method=squash \
            -f 'commit_title=release: authorize verified v0.46.57 Preview once with CTA contrast fix' \
            --jq '.merged' | grep -Fx true
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          MESSAGE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CURRENT" --jq '.commit.message')
          case "$MESSAGE" in
            *'authorize verified v0.46.57 Preview once with CTA contrast fix'*) ;;
            *) echo "::error::Unexpected post-merge source."; exit 1 ;;
          esac
          echo "Merged PR #342 at $CURRENT."
      - name: Dispatch full CI for the freshly merged source
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/dispatches" -f ref=main
          echo "### PR #342 merged; complete main CI dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "Release is gated separately by full green CI, audited binaries and secured publish.yml." >> "$GITHUB_STEP_SUMMARY"
