<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenteeq</title>
  <meta name="description" content="Všichni AI agenti na jednom místě v reálném čase: Claude, ChatGPT a Codex, GitHub Copilot, Cursor, Gemini, Perplexity, Grok a Qwen.">
  <meta name="color-scheme" content="light dark">
  <!-- Barva stavového řádku podle režimu: světlý papír, tmavý inkoust. -->
  <meta name="theme-color" content="#F4F3F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Domovská obrazovka na iOS: vlastní ikona, název a stavový řádek přes celou plochu. -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Stavový řádek: „default" = plocha appky začíná pod ním a jeho pozadí je barva stránky,
       takže na papírovém podkladu zůstane čitelný čas. „black-translucent" by kreslil bílý
       text přes bílé pozadí. iOS si styl přečte při uložení na plochu. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agenteeq">
  <meta name="format-detection" content="telephone=no">
  <script src="/js/appearance-boot.js"></script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/loader.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/desktop.css">
  <link rel="icon" type="image/svg+xml" href="/brand/agenteeq-mark-dark.svg">
</head>
<body>
  <a class="skip-link" href="#view">Přeskočit na obsah</a>

  <div class="shell">
    <div class="stage" aria-hidden="true">
      <div class="stage-glow"></div>
      <div class="stage-sweep"></div>
    </div>

    <aside class="sidebar">
      <a class="brand" href="#/prehled" aria-label="Agenteeq – přehled">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <path class="bm-branch" d="M20 13V29M20 18.5C20 23.5 10.5 22.5 10.5 29M20 18.5C20 23.5 29.5 22.5 29.5 29"/>
          <circle class="bm-root" cx="20" cy="8.5" r="4.2"/>
          <circle class="bm-node" cx="10.5" cy="31" r="3.4"/>
          <circle class="bm-node" cx="20" cy="31" r="3.4"/>
          <circle class="bm-node" cx="29.5" cy="31" r="3.4"/>
        </svg>
        <span>Agenteeq</span>
      </a>
      <div class="profile" id="profile"></div>
      <nav class="nav" aria-label="Hlavní navigace">
        <a href="#/prehled" data-nav="prehled"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M11 3.1A9 9 0 1 0 20.9 13H11z"/><path class="fill" d="M13 2.1v8.9h8.9A9 9 0 0 0 13 2.1z"/></svg><span>Přehled</span></a>
        <a href="#/upozorneni" data-nav="upozorneni" class="nav-secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path class="stroke" d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span>Upozornění</span><b class="nav-badge" data-badge="upozorneni" hidden></b></a>
        <a href="#/agenti" data-nav="agenti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="6" cy="7" r="2.6"/><circle class="fill" cx="18" cy="7" r="2.6"/><circle class="fill" cx="12" cy="17" r="2.6"/><path class="stroke" d="M8 8.5l3 6.5M16 8.5l-3 6.5M8.6 7h6.8"/></svg><span>Agenti</span><b class="nav-badge" data-badge="agenti" hidden></b></a>
        <button class="nav-launch" type="button" data-nav-action="launch" aria-label="Spustit agenta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <a href="#/projekty" data-nav="projekty" data-project-drop="__dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6l2 2h7.4A2.5 2.5 0 0 1 21 9.5V17a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17z"/><path class="stroke inv" d="M8 13.5h8"/></svg><span>Projekty</span></a>
        <a href="#/statistiky" data-nav="statistiky" class="nav-secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fill" x="3" y="3" width="18" height="18" rx="4"/><path class="stroke inv" d="M8 16v-4M12 16V8M16 16v-6"/></svg><span>Statistiky</span></a>
        <a href="#/utrata" data-nav="utrata" class="nav-secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fill" x="3" y="6" width="18" height="14" rx="3"/><path class="stroke inv" d="M15 13h2"/><path class="stroke" d="M7 6V4h10v2"/></svg><span>Útrata</span></a>
        <button class="nav-more" type="button" data-nav-action="more" aria-haspopup="dialog" aria-expanded="false" aria-controls="more-sheet"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="5.5" cy="12" r="2.2"/><circle class="fill" cx="12" cy="12" r="2.2"/><circle class="fill" cx="18.5" cy="12" r="2.2"/></svg><span>Více</span><b class="nav-badge" data-badge="more" hidden></b></button>
        <a href="#/dovednosti" data-nav="dovednosti" class="nav-secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path class="stroke" d="M13 3h4.5A2.5 2.5 0 0 1 20 5.5v11a2.5 2.5 0 0 1-2.5 2.5H13z"/></svg><span>Dovednosti</span></a>
        <a href="#/nastaveni" data-nav="nastaveni" class="nav-secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M9 3v4M15 3v4M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"/></svg><span>Nastavení</span></a>
      </nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <main class="main">
      <div class="offline" id="offline" role="alert" hidden></div>
      <div class="offline" id="storage-alert" role="alert" hidden></div>
      <header class="topbar">
        <h1 class="page-title" id="page-title" tabindex="-1">Přehled</h1>
        <div class="topbar-actions">
          <div class="conn-wrap">
            <button class="conn-pill" id="conn-pill" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="conn-pop"></button>
            <div class="conn-pop" id="conn-pop" role="dialog" aria-label="Stav propojení" hidden></div>
          </div>
          <button class="search-btn" type="button" data-action="palette" aria-keyshortcuts="Meta+K Control+K">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Hledat</span><kbd>⌘K</kbd>
          </button>
          <div class="bell-wrap">
            <button class="icon-btn bell" id="bell" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="notif-pop" aria-label="Upozornění">
              <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
              <b class="bell-badge" id="bell-badge" hidden></b>
            </button>
            <div class="notif-pop" id="notif-pop" role="dialog" aria-label="Poslední upozornění" hidden></div>
          </div>
        </div>
      </header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/js/boot.js"></script>
</body>
</html>
