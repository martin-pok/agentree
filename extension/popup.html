<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Agentree</title>
  <style>
    body { width: 320px; margin: 0; font: 400 14px/1.5 system-ui, -apple-system, sans-serif; color: #1E1B22; background: #F6F5F7; }
    header { display: flex; align-items: center; gap: 10px; padding: 16px; background: #fff; border-bottom: 1px solid #E4E1E8; }
    header strong { font-weight: 500; font-size: 16px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6B6770; margin-left: auto; }
    .dot.ok { background: #1B8F60; box-shadow: 0 0 0 4px rgba(27, 143, 96, .16); }
    .dot.err { background: #C92F57; }
    main { padding: 12px 16px 16px; display: grid; gap: 12px; }
    .muted { color: #6B6770; font-size: 12px; }
    .sites { display: grid; gap: 4px; }
    label.site { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #fff; border-radius: 10px; }
    input[type=checkbox] { width: 16px; height: 16px; accent-color: #1E1B22; }
    details summary { cursor: pointer; font-size: 13px; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    .row input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid #E4E1E8; border-radius: 8px; }
    button, a.btn { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #1E1B22; background: #1E1B22; color: #fff; font: inherit; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    button.sec { background: #fff; color: #1E1B22; height: 32px; }
  </style>
</head>
<body>
  <header><svg width="24" height="24" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 13V29M20 18.5C20 23.5 10.5 22.5 10.5 29M20 18.5C20 23.5 29.5 22.5 29.5 29" stroke="#16141D" stroke-width="3.2" stroke-linecap="round"/><circle cx="20" cy="8.5" r="4.2" fill="#C99A3E"/><circle cx="10.5" cy="31" r="3.4" fill="#16141D"/><circle cx="20" cy="31" r="3.4" fill="#16141D"/><circle cx="29.5" cy="31" r="3.4" fill="#16141D"/></svg><strong>Agentree</strong><span class="muted" id="status">Kontroluji…</span><i class="dot" id="dot"></i></header>
  <main>
    <p class="muted" id="last">Zatím nic neodesláno.</p>
    <div class="sites" id="sites"></div>
    <details>
      <summary>Připojit rozšíření</summary>
      <p class="muted">V Agentree otevři Nastavení → Webové AI aplikace, vytvoř jednorázový kód a vlož ho sem. Platí 10 minut a po použití zmizí.</p>
      <div class="row"><input id="code" type="text" placeholder="Jednorázový kód" autocomplete="off" spellcheck="false"><button class="sec" id="pair" type="button">Připojit</button></div>
    </details>
    <a class="btn" href="http://127.0.0.1:4620/" target="_blank" rel="noopener">Otevřít Agentree</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
